<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" role="img" aria-labelledby="title description">
  <title id="title">Python fundamentals roadmap</title>
  <desc id="description">The course progresses from expressions and control flow, through collections and reusable code, to files, environments, and quality checks.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#536878"/>
    </marker>
    <style>
      .canvas { fill: #f3f6f7; }
      .node { fill: #fff; stroke: #536878; stroke-width: 2; rx: 14; }
      .accent { fill: #e7f6f1; stroke: #27765e; stroke-width: 2; rx: 14; }
      .label { font: 600 18px system-ui, sans-serif; fill: #172b3a; text-anchor: middle; }
      .text { font: 15px system-ui, sans-serif; fill: #344c5d; text-anchor: middle; }
      .line { stroke: #536878; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="canvas" width="960" height="260" rx="20"/>
  <rect class="node" x="25" y="70" width="205" height="105"/>
  <text class="label" x="127" y="112">Start with Python</text>
  <text class="text" x="127" y="141">values • expressions • choices</text>
  <rect class="node" x="265" y="70" width="205" height="105"/>
  <text class="label" x="367" y="112">Work with data</text>
  <text class="text" x="367" y="141">lists • loops • dictionaries</text>
  <rect class="accent" x="505" y="70" width="205" height="105"/>
  <text class="label" x="607" y="112">Organize code</text>
  <text class="text" x="607" y="141">functions • modules • classes</text>
  <rect class="node" x="745" y="70" width="190" height="105"/>
  <text class="label" x="840" y="112">Build reliably</text>
  <text class="text" x="840" y="141">files • tests • linting</text>
  <path class="line" d="M230 122 H257"/>
  <path class="line" d="M470 122 H497"/>
  <path class="line" d="M710 122 H737"/>
  <text class="text" x="480" y="220">Learn the language, then practice the habits that make programs useful.</text>
</svg>
