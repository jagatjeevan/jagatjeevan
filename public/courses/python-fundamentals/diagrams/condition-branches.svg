<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title description">
  <title id="title">Python condition branches</title>
  <desc id="description">A condition sends execution to the if branch when true, or checks an elif condition when false, with else as the remaining case.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#536878"/>
    </marker>
    <style>
      .canvas { fill: #f3f6f7; }
      .node { fill: #fff; stroke: #536878; stroke-width: 2; rx: 14; }
      .decision { fill: #fff4dc; stroke: #a36800; stroke-width: 2; }
      .label { font: 600 21px system-ui, sans-serif; fill: #172b3a; text-anchor: middle; }
      .small { font: 16px system-ui, sans-serif; fill: #344c5d; text-anchor: middle; }
      .line { fill: none; stroke: #536878; stroke-width: 2.5; marker-end: url(#arrow); }
      .branch { font: 600 15px system-ui, sans-serif; fill: #536878; }
    </style>
  </defs>
  <rect class="canvas" width="900" height="390" rx="20"/>
  <path class="line" d="M450 76 V120"/>
  <polygon class="decision" points="450,120 555,185 450,250 345,185"/>
  <text class="label" x="450" y="180">if condition?</text>
  <text class="small" x="450" y="204">score ≥ 90</text>

  <path class="line" d="M345 185 H180 V280"/>
  <text class="branch" x="235" y="173">True</text>
  <rect class="node" x="85" y="280" width="190" height="70"/>
  <text class="label" x="180" y="323">if block</text>

  <path class="line" d="M555 185 H720 V235"/>
  <text class="branch" x="640" y="173">False</text>
  <rect class="decision" x="625" y="235" width="190" height="65" rx="14"/>
  <text class="label" x="720" y="276">elif condition?</text>
  <path class="line" d="M675 300 L580 345"/>
  <path class="line" d="M765 300 L825 345"/>
  <text class="branch" x="603" y="324">True</text>
  <text class="branch" x="797" y="324">False</text>
  <text class="small" x="550" y="372">elif block</text>
  <text class="small" x="825" y="372">else block</text>
  <text class="small" x="450" y="52">Evaluate from top to bottom; run the first matching branch</text>
</svg>
