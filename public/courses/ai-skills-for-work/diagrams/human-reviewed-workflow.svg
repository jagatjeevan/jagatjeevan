<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title description">
  <title id="title">Human-reviewed AI workflow</title>
  <desc id="description">A scoped trigger and inputs flow through AI-assisted processing and validation to human review. Only approved output reaches a consequential action, with monitoring throughout.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#536878"/>
    </marker>
    <style>
      .box { fill: #f4f7f9; stroke: #536878; stroke-width: 2; rx: 12; }
      .gate { fill: #fff4dc; stroke: #a36800; stroke-width: 2; rx: 12; }
      .text { font: 600 18px system-ui, sans-serif; fill: #172b3a; text-anchor: middle; }
      .sub { font: 14px system-ui, sans-serif; fill: #344c5d; text-anchor: middle; }
      .arrow { stroke: #536878; stroke-width: 2.5; marker-end: url(#arrow); }
      .monitor { fill: none; stroke: #73899a; stroke-width: 2; stroke-dasharray: 7 6; }
    </style>
  </defs>
  <rect class="box" x="25" y="83" width="160" height="100"/>
  <text class="text" x="105" y="121">Trigger</text>
  <text class="sub" x="105" y="148">Scoped inputs</text>

  <rect class="box" x="225" y="83" width="175" height="100"/>
  <text class="text" x="312" y="121">AI-assisted</text>
  <text class="sub" x="312" y="148">Process and draft</text>

  <rect class="box" x="440" y="83" width="155" height="100"/>
  <text class="text" x="517" y="121">Validate</text>
  <text class="sub" x="517" y="148">Rules and checks</text>

  <rect class="gate" x="635" y="83" width="155" height="100"/>
  <text class="text" x="712" y="121">Human review</text>
  <text class="sub" x="712" y="148">Approve or stop</text>

  <rect class="box" x="830" y="83" width="110" height="100"/>
  <text class="text" x="885" y="121">Action</text>
  <text class="sub" x="885" y="148">If approved</text>

  <path class="arrow" d="M185 133 H218"/>
  <path class="arrow" d="M400 133 H433"/>
  <path class="arrow" d="M595 133 H628"/>
  <path class="arrow" d="M790 133 H823"/>
  <path class="monitor" d="M45 220 H920"/>
  <path class="monitor" d="M105 183 V220 M312 183 V220 M517 183 V220 M712 183 V220 M885 183 V220"/>
  <text class="sub" x="480" y="255">Monitor runs, errors, access, and outcomes</text>
</svg>
